# CONTINUOUS INTEGRATION
# This workflow runs lint, tests, and security checks on every push/PR.
# Runs on GitHub's cloud runners (ubuntu-latest).
# Production deploys via Railway (auto-deploy from main branch).

name: CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  # How many parallel legs run the test suite. The test-shard matrix lists
  # 1..TEST_SPLITS, and each leg refuses to run if the two disagree.
  TEST_SPLITS: "5"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Scope is the whole repository, not a directory list. tests/ is linted
      # for the same reason src/ is: a test that does not run is not a weaker
      # defect than code that does not work, and the pyflakes rules the repo
      # selects (F811 in particular) catch a shadowed definition that no test
      # count, tick or coverage number can show. The same argument reaches
      # every other directory, which is why none are named — an allowlist here
      # is complete only until the next directory lands, and it goes stale
      # without turning anything red. Exclusions live in ruff.toml.
      - name: Run ruff check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format . --check

  telegram-ratchet:
    name: Telegram ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No install step, deliberately: the ratchet is stdlib-only, so it runs
      # before and independently of the application's dependency tree. A gate
      # that needs the app installed to tell you the app is coupled is a gate
      # that goes dark exactly when the dependency tree is what broke.
      #
      # Its own job rather than a step inside Lint, because a ratchet's whole
      # purpose is visibility: "Telegram ratchet" names the failure on the
      # PR page, where a red step buried in Lint would read as a formatting nit.
      - name: Run the Telegram ratchet
        run: python scripts/telegram_ratchet.py

  # The suite in TEST_SPLITS parallel legs. pytest-split divides it by the
  # recorded test times in .test_durations, into contiguous chunks of the
  # collection order, so every test lands in exactly one leg's share as long as
  # every leg collects the same suite. Each leg proves that by fingerprinting
  # what it collected, and `Test` below compares the fingerprints. One
  # PostgreSQL per leg: tests/scripts holds a cluster-wide advisory lock for a
  # whole session and refuses pytest-xdist.
  test-shard:
    name: Test shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    # Well inside Railway's two-hour wait on the run: a hung leg fails here
    # rather than leaving the deploy to time out.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    env:
      # One collection order in every process that has to agree on it.
      PYTHONHASHSEED: "0"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: storyline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check the matrix covers TEST_SPLITS
        run: test "${{ strategy.job-total }}" = "$TEST_SPLITS"

      - uses: actions/checkout@v4
        with:
          # Migration tests build the pinned schema-code base from history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Install package
        # the CLI extra too: `storydump_cli` is tested here, with its real
        # credential-store dependency rather than whatever is around
        run: pip install -e '.[cli]'

      - name: Install local media probe tools
        # Tests fail if tools are absent; actual deployment versions are proven
        # separately in the pinned Nixpacks image, not inferred from this runner.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate test encryption key
        id: gen-key
        run: echo "key=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_OUTPUT"

      # The fingerprint of the WHOLE collection, not of this leg's share: every
      # leg must report the same one for the split to be exact. pytest's own
      # count is checked against the ids read, so a line the pattern misses
      # cannot shrink the fingerprinted list unnoticed.
      - name: Fingerprint the collected suite
        run: |
          python -m pytest --collect-only -qq --no-cov tests/ > collection.txt
          grep -E '^\S+\.py::' collection.txt > ids.txt
          collected=$(sed -n -E 's/^([0-9]+)(\/[0-9]+)? tests? collected.*/\1/p' collection.txt | tail -n 1)
          test "$(wc -l < ids.txt)" -eq "$collected"
          echo "$(sha256sum < ids.txt | cut -d ' ' -f 1) $collected" > "collection-shard-${{ matrix.group }}.txt"
          cat "collection-shard-${{ matrix.group }}.txt"

      - name: Run this shard of the tests with coverage
        env:
          # Database configuration (individual components for Settings class)
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: storyline_ai
          TEST_DB_NAME: storyline_test
          # Security — generate a fresh Fernet key per run instead of
          # committing a static test key in the workflow file.
          ENCRYPTION_KEY: ${{ steps.gen-key.outputs.key }}
          # Integration coverage is MANDATORY here (#758). Without this, a
          # service container that fails to come up makes every DB-backed test
          # SKIP, and the run still exits 0 and shows a green tick — a pass
          # that never executed the tests it claims to cover.
          REQUIRE_TEST_DATABASE: "1"
          LOG_LEVEL: DEBUG
        # --store-durations --clean-durations rewrite this leg's copy of the
        # times with exactly the tests it ran; `Test` merges the five copies.
        run: |
          cp .test_durations "test-durations-shard-${{ matrix.group }}.json"
          pytest tests/ -v --cov=src --cov=storydump_cli \
            --splits "$TEST_SPLITS" --group "${{ matrix.group }}" \
            --durations-path "test-durations-shard-${{ matrix.group }}.json" \
            --store-durations --clean-durations
          mv .coverage ".coverage.shard-${{ matrix.group }}"

      # Uploaded only after a green run: a failed leg publishes no times.
      - name: Upload the collection fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: collection-shard-${{ matrix.group }}
          path: collection-shard-${{ matrix.group }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.group }}
          path: .coverage.shard-${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload test durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.group }}
          path: test-durations-shard-${{ matrix.group }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The one test check the rest of the repository knows by name:
  # scripts/pr_ready.sh requires it and the docs describe it. It runs whatever
  # happened upstream — `always()`, NOT `!cancelled()`, because a skipped job
  # reports success — and passes only when every leg passed and every leg
  # collected the same suite.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-shard]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Require every test shard to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "test-shard: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

      - name: Download the collection fingerprints
        uses: actions/download-artifact@v4
        with:
          pattern: collection-shard-*
          path: fingerprints
          merge-multiple: true

      # pytest-split puts each test in exactly one leg's share when every leg
      # collected the same suite. Five files, one distinct line.
      - name: Require one collected suite across every shard
        run: |
          cat fingerprints/*.txt
          test "$(ls fingerprints | wc -l)" -eq "$TEST_SPLITS"
          test "$(sort -u fingerprints/*.txt | wc -l)" -eq 1

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Coverage gates nothing (there is no threshold), so a failure to combine
      # or report it must not fail Test either.
      - name: Download coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-shard-*
          path: coverage-parts
          merge-multiple: true

      - name: Combine coverage into the run summary
        continue-on-error: true
        run: |
          pip install "$(grep -E '^pytest-cov==' requirements.txt)"
          coverage combine coverage-parts
          {
            echo "### Coverage: $(coverage report --format=total)%"
            echo
            coverage report --format=markdown --skip-covered --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download test durations
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: durations-shard-*
          path: durations-parts
          merge-multiple: true

      # A refreshed .test_durations for when the shards drift apart: download
      # this artifact from a green main run and commit it
      # (documentation/guides/testing-guide.md).
      - name: Merge the shards' test durations
        continue-on-error: true
        run: |
          jq -S --indent 4 -s 'add | map_values((. * 1000 | round) / 1000)' durations-parts/*.json > .test_durations

      - name: Upload the merged test durations
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pip-audit bandit

      # This step GATES: a known-vulnerable pin fails the job. A real
      # suppression carries the real advisory id and a comment saying why it
      # does not apply; a placeholder is not a suppression, it is a disabled
      # check.
      - name: Run pip-audit
        run: pip-audit -r requirements.txt

      # Advisory: bandit's findings on this tree have not been triaged,
      # so it reports without gating. pip-audit above DOES gate — a
      # known-vulnerable pin fails CI.
      - name: Run bandit security scan
        run: bandit -r src/ storydump_cli/ -ll -ii --format json --output bandit-report.json || true
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()

  front-end:
    name: Front End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    # NO `paths:` FILTER, and that is the load-bearing choice rather than an
    # omission (#1068/#1052).
    #
    # A filtered workflow is never SCHEDULED on a PR that touches none of its
    # paths, so a check that is also REQUIRED can never arrive and the PR
    # strands forever. Leaving this job unfiltered keeps the check always
    # PRESENT, which is what makes it safe to require. Every job in this
    # workflow runs on every PR.
    #
    # Running it on a backend-only PR costs runner time in parallel with
    # the test shards, so it adds nothing to the wall-clock a person waits
    # for, and a gate that costs nothing is a gate nobody routes around.
    #
    # scripts/pr_ready.sh requires eight checks by name: Lint, Telegram
    # ratchet, Test, Security Scan, Front End, Public record, Changelog Check
    # and Schema consistency. The test-shard matrix is declared there too, as
    # covered by Test, and the script checks both lists against this workflow.
    # GitHub rulesets govern merge policy; review that configuration when
    # changing job names.
    #
    # `next build` is deliberately ABSENT: Vercel already builds every PR, so
    # duplicating it here buys nothing but minutes.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than floating, and mirrored by `engines` in
          # landing/package.json so CI and a laptop agree on the contract.
          node-version: '22'
          cache: npm
          # The lockfile is in landing/, not at the repo root; without this the
          # cache key is computed from a file that does not exist and the
          # install is uncached on every run.
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The package's own scripts where they exist, so a change to what `test`
      # or `lint` means follows here without editing this file. `tsc` has no
      # script and is invoked directly.
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # This step GATES, like pip-audit in Security Scan: a known advisory
      # against a runtime dependency, direct or transitive, fails the job.
      # `--omit=dev` scopes it to a production install; the devDependencies
      # it skips include the build's Tailwind toolchain and the CSS it
      # bundles, not just test and lint tooling. There is no `--audit-level`:
      # npm audit cannot suppress one advisory, so a severity floor would hide
      # every advisory below it. Clear one with a bump or an `overrides` pin
      # in landing/package.json; one with no fixed release is silenced only by
      # an edit here, under pip-audit's suppression rule above. It lives here,
      # not in Security Scan, because Node and landing/ are set up here.
      #
      # It runs whether or not the lockfile changed, so a newly published
      # advisory turns every PR red until a bump lands. It runs last so a
      # PR's own tests, typecheck and lint still report.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  public-record:
    name: Public record
    runs-on: ubuntu-latest
    # The list is the repository secret PRIVATE_IDENTIFIERS, which GitHub
    # withholds from a fork's pull request and from a run Dependabot starts, so
    # the job skips both; once such a PR lands, the push run checks its files
    # and the commit messages it brings, though not its description. A commit
    # someone else pushes to a Dependabot branch starts a run that has the
    # secret.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No install step: the check is stdlib-only, like the Telegram ratchet.
      # --require-list makes a missing or emptied secret a failure, never a
      # clean pass. --count-only because this log is public: a file and line
      # would show anyone the word, and so what the list holds.
      # On a pull request it also reads the commits the PR adds and its title
      # and body as they stood when the run started; a description edited
      # after the last push is read again at the next one. On a push it reads
      # the commit messages the push brings.
      - name: Check the public record
        env:
          PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/public_record.py --require-list --count-only \
              --commits "origin/$BASE_REF..HEAD" --event "$GITHUB_EVENT_PATH"
          else
            python scripts/public_record.py --require-list --count-only \
              --event "$GITHUB_EVENT_PATH"
          fi

  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A PR adds its entry as a new file in changelog.d/ and never edits
      # CHANGELOG.md, so no two PRs change the same lines; a docs-only PR needs
      # no fragment. changelog.d/README.md states the rule; the script holds it.
      - name: Check the changelog fragment
        run: python scripts/changelog_fragments.py check --base "origin/${{ github.base_ref }}"

  schema-consistency:
    name: Schema consistency
    runs-on: ubuntu-latest
    services:
      postgres-code:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: storyline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-replay:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: storyline_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare schema code with the migration tail
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/storyline_test
          REPLAY_DATABASE_URL: postgresql://test_user:test_password@localhost:5433/storyline_test
        run: python -m scripts.schema_consistency --out schema-consistency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-consistency
          path: schema-consistency/
