[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && pip install -e . && mkdir -p /tmp/media"

[deploy]
# DORMANT (plan §0.2 / #712): the migration runner ships unarmed — enabling
# the predeploy apply is a human-gated step AFTER `runner adopt` has entered
# production into the ledger. To arm, uncomment on both services; the
# runner's advisory lock serializes concurrent deploys, and a migration
# failure aborts the deploy with the old version still serving.
# See documentation/operations/migration-runner.md.
# preDeployCommand = "python -m scripts.migration_runner apply"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Give the old worker 60s to release its Telegram polling session before
# SIGKILL fires. Without this, new worker deploys fail with
# `telegram.error.Conflict: terminated by other getUpdates request` because
# Telegram still sees the old session as active when the new worker tries
# to start. See issue #392.
drainingSeconds = 60
